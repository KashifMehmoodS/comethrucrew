<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Comethru Crew Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editorial roster of giant names on the left, a sticky JD sheet on the right; a brand ribbon above filters the roster by client.
   Written for every current browser, Safari included: no flex gap, aspect-ratio, inset or logical properties, plain fallbacks before clamp(), and rgba fallbacks instead of color-mix(). */
:root{
  --paper:#F3F1EC; --surface:#FFFFFF; --ink:#141414; --muted:#5E5B55; --line:#D6D2C9;
  --accent:#EE5F22; --on-accent:#141414; --ghost:#E6E2D9;
  --accent-soft:rgba(238,95,34,.16); --accent-glow:rgba(238,95,34,.26);
  --f-display:'Bricolage Grotesque','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-mono:'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gutter:clamp(16px,4vw,48px);
}
@supports not (width:clamp(1px,1vw,2px)){ :root{ --gutter:24px } }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11100F; --surface:#1A1917; --ink:#F2EFE9; --muted:#A8A39A; --line:#2E2B28;
    --accent:#F0682B; --on-accent:#141414; --ghost:#262421;
    --accent-soft:rgba(240,104,43,.2); --accent-glow:rgba(240,104,43,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11100F; --surface:#1A1917; --ink:#F2EFE9; --muted:#A8A39A; --line:#2E2B28;
  --accent:#F0682B; --on-accent:#141414; --ghost:#262421;
  --accent-soft:rgba(240,104,43,.2); --accent-glow:rgba(240,104,43,.32);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;margin:0;-webkit-appearance:none;-moz-appearance:none;appearance:none}
:focus{outline:3px solid var(--accent);outline-offset:3px}
:focus:not(:focus-visible){outline:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:24px}
.logo{display:inline-flex;align-items:center}
.logo img{display:block;width:auto;height:48px;height:clamp(40px,4.4vw,56px)}
.logo .on-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo .on-light{display:none}
  :root:not([data-theme="light"]) .logo .on-dark{display:block}
}
:root[data-theme="dark"] .logo .on-light{display:none}
:root[data-theme="dark"] .logo .on-dark{display:block}
.stamp{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* hero */
.hero{position:relative;padding-top:64px;padding-top:clamp(36px,7vw,96px);padding-bottom:40px;padding-bottom:clamp(28px,4vw,56px)}
.hero h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:120px;font-size:clamp(60px,12.5vw,184px);line-height:.88;letter-spacing:-.045em}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
.hero h1 .w>span{display:inline-block;-webkit-animation:rise-word .9s var(--ease) both;animation:rise-word .9s var(--ease) both}
.hero h1 .w>.d1{-webkit-animation-delay:90ms;animation-delay:90ms}
.hero h1 .pill{display:inline-block;padding:0 .16em .06em;background:var(--accent);color:var(--on-accent);border-radius:1em;-webkit-transform:rotate(-4deg);transform:rotate(-4deg);-webkit-transform-origin:20% 80%;transform-origin:20% 80%;-webkit-animation:drop-pill 1.1s cubic-bezier(.34,1.56,.64,1) .32s both;animation:drop-pill 1.1s cubic-bezier(.34,1.56,.64,1) .32s both}
.hero h1.settled .w{overflow:visible}
.hero h1 .ch{display:inline-block;-webkit-transform-origin:50% 90%;transform-origin:50% 90%}
.hero h1 .ch.pop{-webkit-animation:pop .7s cubic-bezier(.34,1.56,.64,1);animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
.mag{display:inline-block;cursor:pointer;-webkit-transition:-webkit-transform .45s var(--ease);transition:transform .45s var(--ease)}
.mag.wobble{-webkit-animation:wobble .8s var(--ease);animation:wobble .8s var(--ease)}

/* orbit toy: the moon pauses under the cursor, can be grabbed, strains against the hold and snaps back */
.orbit{position:absolute;right:0;top:64px;top:clamp(36px,7vw,96px);width:160px;height:160px;width:clamp(120px,14vw,190px);height:clamp(120px,14vw,190px);pointer-events:none}
.orbit .ring{position:absolute;top:0;right:0;bottom:0;left:0;border:2px solid var(--ink);border-radius:50%;-webkit-transition:border-color .3s var(--ease),-webkit-transform .4s var(--ease);transition:border-color .3s var(--ease),transform .4s var(--ease)}
.orbit.is-tense .ring{border-color:var(--accent);-webkit-transform:scale(.97);transform:scale(.97)}
.orbit.is-boing .ring{-webkit-animation:boing .6s cubic-bezier(.34,1.56,.64,1);animation:boing .6s cubic-bezier(.34,1.56,.64,1)}
.orbit .dots{position:absolute;left:-46%;bottom:-18%;width:62%;height:49.6%;background-image:radial-gradient(circle,var(--accent) 3.2px,transparent 3.6px);background-size:20% 25%}
.tether{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tether line{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round;opacity:0}
.moon{position:absolute;left:41%;top:-9%;z-index:2;width:18%;height:18%;border-radius:50%;background:var(--accent);pointer-events:auto;cursor:-webkit-grab;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform;-webkit-transition:box-shadow .3s var(--ease);transition:box-shadow .3s var(--ease)}
.moon.is-hover{box-shadow:0 0 0 7px var(--accent-glow)}
.moon.is-held{cursor:-webkit-grabbing;cursor:grabbing;box-shadow:0 0 0 12px var(--accent-glow)}
@media (max-width:760px){.orbit{display:none}}

/* cursor: the logo's orange dot; sparks */
html.dot-cursor,html.dot-cursor *{cursor:none!important}
.cursor{position:fixed;left:0;top:0;z-index:70;pointer-events:none;opacity:0;-webkit-transition:opacity .2s;transition:opacity .2s}
.cursor.on{opacity:1}
.cursor-dot{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);-webkit-transition:-webkit-transform .3s var(--ease),opacity .25s,background-color .25s;transition:transform .3s var(--ease),opacity .25s,background-color .25s}
.cursor.hot .cursor-dot{-webkit-transform:scale(2.4);transform:scale(2.4);opacity:.55}
.cursor.on-orange .cursor-dot{background:var(--ink)}
.cursor.held .cursor-dot{-webkit-transform:scale(.75);transform:scale(.75);opacity:1}
.spark{position:fixed;z-index:60;width:16px;height:16px;pointer-events:none;color:var(--accent)}
.spark svg{display:block;width:100%;height:100%;fill:currentColor}

/* brand ribbon: one row, speed follows page scroll */
.band{position:relative;background:var(--accent);color:var(--on-accent);overflow:hidden}
.band-view{overflow:hidden;-webkit-mask-image:-webkit-linear-gradient(left,transparent 0,#000 14%,#000 90%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 90%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 90%,transparent 100%)}
.band-track{display:-webkit-box;display:flex;width:-webkit-max-content;width:-moz-max-content;width:max-content;will-change:transform}
.band-tag{position:absolute;z-index:2;top:50%;left:max(var(--gutter),env(safe-area-inset-left,0px));-webkit-transform:translateY(-50%);transform:translateY(-50%);display:inline-flex;align-items:center;padding:9px 14px;border-radius:18px;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.band-tag i{width:7px;height:7px;margin-right:8px;border-radius:50%;background:var(--accent)}
@media (max-width:560px){.band-tag{display:none}}
.band-set{display:flex;align-items:center;flex-shrink:0;padding:18px 0;padding:clamp(14px,1.8vw,22px) 0;font-family:var(--f-display);font-weight:800;font-size:40px;font-size:clamp(28px,3.8vw,52px);line-height:1;letter-spacing:-.035em;white-space:nowrap;text-transform:uppercase}
.band-set>*{flex-shrink:0;margin-right:20px;margin-right:clamp(14px,2vw,28px)}
.band-set span{padding:.1em .3em .14em;border-radius:.6em;-webkit-transition:background-color .3s var(--ease),color .3s var(--ease);transition:background-color .3s var(--ease),color .3s var(--ease)}
.band-set span:hover{background:var(--ink);color:var(--accent)}
.star{width:.6em;height:.6em;fill:currentColor;-webkit-animation:spin 7s linear infinite;animation:spin 7s linear infinite}

/* brand filter */
.filter{padding-top:40px;padding-top:clamp(32px,4vw,48px);padding-bottom:24px;padding-bottom:clamp(20px,3vw,32px)}
.filter-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;margin:-4px}
.chip{margin:4px;min-height:44px;padding:8px 16px;border:1.5px solid var(--ink);border-radius:22px;background:transparent;cursor:pointer;font-weight:500;font-size:15px;-webkit-transition:background-color .25s var(--ease),color .25s var(--ease),-webkit-transform .25s var(--ease);transition:background-color .25s var(--ease),color .25s var(--ease),transform .25s var(--ease)}
.chip:hover{-webkit-transform:translateY(-2px);transform:translateY(-2px)}
.chip[aria-pressed="true"],.chip.is-preview{background:var(--ink);color:var(--paper)}
.clear{min-height:44px;padding:8px 4px;border:0;background:none;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:underline}
.status{margin:14px 0 0;min-height:24px;font-size:15px;color:var(--muted)}
.status b{color:var(--ink);font-weight:600}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);grid-column-gap:48px;column-gap:48px;column-gap:clamp(24px,4vw,64px);align-items:start;padding-bottom:80px;padding-bottom:clamp(56px,8vw,112px)}
@media (max-width:960px){.stage{grid-template-columns:minmax(0,1fr)}.sheet{display:none}}

.team+.team{margin-top:36px;margin-top:clamp(28px,3.5vw,44px)}
.team-label{display:flex;align-items:center;margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.team-label::before{content:"";width:10px;height:10px;margin-right:12px;border-radius:50%;background:var(--accent);flex-shrink:0}
.team-label::after{content:"";flex:1 1 auto;height:1.5px;margin-left:12px;background:var(--ink)}

.row{position:relative;z-index:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-column-gap:16px;column-gap:16px;align-items:center;width:100%;padding:12px 12px 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;cursor:pointer;-webkit-transition:opacity .35s var(--ease),color .35s var(--ease);transition:opacity .35s var(--ease),color .35s var(--ease)}
.row::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:-1;background:var(--accent);-webkit-transform:scaleX(0);transform:scaleX(0);-webkit-transform-origin:left center;transform-origin:left center;-webkit-transition:-webkit-transform .55s var(--ease);transition:transform .55s var(--ease)}
.row.is-active{color:var(--on-accent)}
.row.is-active::before{-webkit-transform:scaleX(1);transform:scaleX(1)}
.row:focus{outline:3px solid var(--ink);outline-offset:-3px}
.row:focus:not(:focus-visible){outline:none}
.row-name{display:block;min-width:0;font-family:var(--f-display);font-weight:700;font-size:72px;font-size:clamp(42px,6.4vw,96px);line-height:.95;letter-spacing:-.04em;word-wrap:break-word;-webkit-transition:-webkit-transform .55s var(--ease);transition:transform .55s var(--ease)}
.row.is-active .row-name{-webkit-transform:translateX(12px);transform:translateX(12px)}
.row-role{font-family:var(--f-mono);font-size:11.5px;line-height:1.4;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;max-width:20ch;-webkit-transition:color .35s var(--ease);transition:color .35s var(--ease)}
.row.is-active .row-role{color:var(--on-accent)}
.row-arrow{width:32px;height:32px;width:clamp(26px,3vw,40px);height:clamp(26px,3vw,40px);-webkit-transform:rotate(-45deg);transform:rotate(-45deg);opacity:.35;-webkit-transition:-webkit-transform .55s var(--ease),opacity .35s;transition:transform .55s var(--ease),opacity .35s}
.row.is-active .row-arrow{-webkit-transform:rotate(0deg);transform:rotate(0deg);opacity:1}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row-role{display:none}}
.roster.filtering .row:not(.match){opacity:.18}
.roster.filtering .row.match .row-name{text-decoration:underline;-webkit-text-decoration-color:var(--accent);text-decoration-color:var(--accent);text-decoration-thickness:.07em;text-underline-offset:.08em}
.roster.filtering .row.match.is-active .row-name{-webkit-text-decoration-color:var(--on-accent);text-decoration-color:var(--on-accent)}

/* JD sheet */
.sheet{position:-webkit-sticky;position:sticky;top:24px;top:calc(env(safe-area-inset-top,0px) + 24px);z-index:0;background:var(--surface);border:1.5px solid var(--ink);border-radius:28px;padding:32px;padding:clamp(24px,3vw,40px);overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:600px;min-height:min(620px,calc(100vh - 48px));max-height:calc(100vh - 48px);-webkit-transition:-webkit-transform .6s var(--ease);transition:transform .6s var(--ease)}
.ghost{position:absolute;right:-.06em;bottom:-.28em;z-index:-1;font-family:var(--f-display);font-weight:800;font-size:360px;font-size:clamp(260px,30vw,440px);line-height:1;color:var(--ghost);pointer-events:none;-webkit-animation:ghost-in .9s var(--ease) both;animation:ghost-in .9s var(--ease) both}
.jd-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.jd-top>*{margin:4px 0}
.team-chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:16px;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.team-chip i{width:7px;height:7px;margin-right:8px;border-radius:50%;background:var(--accent)}
.jd-name{margin:18px 0 6px;font-family:var(--f-display);font-weight:800;font-size:72px;font-size:clamp(52px,6vw,96px);line-height:.92;letter-spacing:-.045em;word-wrap:break-word}
.jd-name span{display:inline-block;-webkit-animation:letter-in .7s var(--ease) both;animation:letter-in .7s var(--ease) both}
.jd-name .jd-word{display:inline-block;white-space:nowrap;-webkit-animation:none;animation:none}
.jd-role{margin:0;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.jd-list{margin-top:24px;border-top:1.5px solid var(--ink)}
.jd-row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);grid-column-gap:16px;column-gap:16px;padding:14px 10px;margin:0 -10px;border-bottom:1px dashed var(--line);border-radius:10px;-webkit-animation:rise .6s var(--ease) both;animation:rise .6s var(--ease) both;-webkit-transition:background-color .3s var(--ease);transition:background-color .3s var(--ease)}
.jd-row.hit{background:var(--accent-soft)}
.brand{display:flex;align-items:flex-start;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.35;letter-spacing:-.01em}
.brand::before{content:"";flex-shrink:0;width:9px;height:9px;margin:.45em 9px 0 0;border-radius:50%;background:var(--accent)}
.tasks{margin:0;padding:0;list-style:none;font-size:16px;line-height:1.45;min-width:0}
.tasks li{display:block}
.tasks li+li{margin-top:5px}
.jd-list.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-column-gap:24px;column-gap:24px}
.jd-row.cat{display:block;margin:0;padding:16px 0;border-radius:0}
.jd-row.cat .brand{font-size:16px}
.jd-row.cat .tasks{margin-top:8px;font-size:15px}
.jd-row.solo{grid-template-columns:minmax(0,1fr)}
.jd-row.solo .tasks{font-family:var(--f-display);font-weight:700;font-size:28px;font-size:clamp(24px,2.4vw,32px);line-height:1.15;letter-spacing:-.02em}
.jd-row.solo .tasks li{display:flex;align-items:flex-start}
.jd-row.solo .tasks li+li{margin-top:10px}
.jd-row.solo .tasks li::before{content:"";flex-shrink:0;width:16px;height:16px;margin:.22em 12px 0 0;border-radius:50%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:10px;gap:10px;margin-top:4px}
.stat{padding:16px;border-radius:16px;background:var(--ink);color:var(--paper);-webkit-animation:rise .6s var(--ease) both;animation:rise .6s var(--ease) both}
.stat b{display:block;margin-bottom:6px;font-family:var(--f-display);font-weight:800;font-size:48px;font-size:clamp(40px,4vw,56px);line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13.5px;line-height:1.35}

/* inline JD for narrow screens */
.inline{padding:20px 4px 28px;border-bottom:1.5px solid var(--ink)}
.inline .jd-name{display:none}
.inline .jd-list{margin-top:14px}

footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:28px;padding-bottom:40px;border-top:1.5px solid var(--ink)}
footer>*{margin:4px 0}
footer .logo img{height:32px}

@-webkit-keyframes rise-word{from{-webkit-transform:translateY(105%)}to{-webkit-transform:none}}
@keyframes rise-word{from{transform:translateY(105%)}to{transform:none}}
@-webkit-keyframes drop-pill{from{-webkit-transform:translateY(-60%) rotate(-22deg);opacity:0}to{-webkit-transform:rotate(-4deg);opacity:1}}
@keyframes drop-pill{from{transform:translateY(-60%) rotate(-22deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}
@-webkit-keyframes rise{from{opacity:0;-webkit-transform:translateY(14px)}to{opacity:1;-webkit-transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@-webkit-keyframes letter-in{from{opacity:0;-webkit-transform:translateY(.45em) rotate(8deg)}to{opacity:1;-webkit-transform:none}}
@keyframes letter-in{from{opacity:0;transform:translateY(.45em) rotate(8deg)}to{opacity:1;transform:none}}
@-webkit-keyframes ghost-in{from{opacity:0;-webkit-transform:translateY(40px) rotate(-8deg)}to{opacity:1;-webkit-transform:none}}
@keyframes ghost-in{from{opacity:0;transform:translateY(40px) rotate(-8deg)}to{opacity:1;transform:none}}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@-webkit-keyframes pop{0%{-webkit-transform:none}35%{-webkit-transform:translateY(-.2em) rotate(-9deg) scale(1.06);color:var(--accent)}65%{-webkit-transform:translateY(.03em) rotate(3deg)}100%{-webkit-transform:none}}
@keyframes pop{0%{transform:none}35%{transform:translateY(-.2em) rotate(-9deg) scale(1.06);color:var(--accent)}65%{transform:translateY(.03em) rotate(3deg)}100%{transform:none}}
@-webkit-keyframes wobble{0%{-webkit-transform:none}22%{-webkit-transform:rotate(14deg) scale(1.1)}48%{-webkit-transform:rotate(-9deg)}72%{-webkit-transform:rotate(4deg)}100%{-webkit-transform:none}}
@keyframes wobble{0%{transform:none}22%{transform:rotate(14deg) scale(1.1)}48%{transform:rotate(-9deg)}72%{transform:rotate(4deg)}100%{transform:none}}
@-webkit-keyframes boing{0%{-webkit-transform:scale(1)}40%{-webkit-transform:scale(1.09)}100%{-webkit-transform:scale(1)}}

    sheet.addEventListener(EV.leave, function(){ setTf(sheet, ''); });
  }

  /* initial state: first person open so the page reads complete at rest */
  if (wideMQ.matches) setActive('rehman');
})();
</script>
